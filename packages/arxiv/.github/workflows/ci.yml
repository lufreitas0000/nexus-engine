name: CI Pipeline

on:
  push:
    branches: [ "main", "feat/*", "dev/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio textual httpx
          pip install -r requirements.txt
      - name: Run Domain and Service Unit Tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
        run: pytest orchestrator/tests research_graph/tests document_processor/tests
      - name: Headless TUI Tests
        env:
          TEXTUAL_HEADLESS: "1"
        run: pytest front/tests
