name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: arxiv
          POSTGRES_PASSWORD: password
          POSTGRES_DB: research_graph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pymupdf  # needed for spliter testing

    - name: Type checking with mypy
      run: |
        mypy --ignore-missing-imports research_graph/ ingestion_engine/ document_processor/ document_converter/ api/ common/

    - name: Run tests with pytest
      run: |
        python -m pytest .
      env:
        DATABASE_URL: postgresql+asyncpg://arxiv:password@localhost:5432/research_graph_test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker-compose build
