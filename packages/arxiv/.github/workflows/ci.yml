name: CI Pipeline

on:
  push:
    branches: [ "main", "feat/*", "dev/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio textual httpx
          pip install -r requirements.txt
      - name: Run Domain and Service Unit Tests
        run: pytest orchestrator/test research_graph/test document_processor/test
      - name: Headless TUI Tests
        env:
          TEXTUAL_HEADLESS: "1"
        run: pytest front/tests
