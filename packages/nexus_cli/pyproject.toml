[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus_cli"
version = "0.1.0"
description = "Unified CLI for Nexus Engine"
requires-python = ">=3.12"
dependencies = [
    "arxiv",
    "convert",
    "kindle",
    "nexus_schema",
    "nexus_workspace",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
nexus = "nexus_cli.main:app"

[tool.setuptools]
packages = ["nexus_cli"]

[tool.uv.sources]
arxiv = { workspace = true }
convert = { workspace = true }
kindle = { workspace = true }
nexus_schema = { workspace = true }
nexus_workspace = { workspace = true }
