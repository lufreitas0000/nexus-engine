[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic_pdf_pipeline"
version = "0.1.0"
description = "A microservice-oriented monorepo for Semantic PDF Parsing."
authors = [{name = "Jules"}]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "httpx>=0.25.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "tenacity>=8.0.0",
    "pybreaker>=1.2.0",
    "celery[redis]>=5.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0.0",
    "filelock>=3.12.0"
]
