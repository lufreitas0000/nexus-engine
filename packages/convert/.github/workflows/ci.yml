name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy pytest pytest-cov pytest-xdist filelock
        pip install -r requirements.txt

    - name: Run Black (Formatting Check)
      run: black --check app_orchestrator app_spatial_compiler app_structurizer app_vision_encoder tests cli.py

    - name: Run Flake8 (Linting)
      run: flake8 app_orchestrator app_spatial_compiler app_structurizer app_vision_encoder tests cli.py

    - name: Run Mypy (Static Types)
      run: make lint

    - name: Run Pytest
      run: export PYTHONPATH=$(pwd) && pytest -n auto -v

  docker-build-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate Docker Compose Config
      run: docker compose config

    - name: Test CPU Build Reproducibility
      run: make docker-build-cpu
